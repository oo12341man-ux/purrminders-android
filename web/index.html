<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Purrminders</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a1f2d;--card:#fffaf2;--line:#2a1f2d;--accent:#ff9a62;box-sizing:border-box;padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#fff3e6;--card:#2b2433;--line:#120c16}}
:root[data-theme="dark"]{--ink:#fff3e6;--card:#2b2433;--line:#120c16}
html{scroll-padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px))}
html,body{height:100%;margin:0;overflow:hidden;background:#1b1420;color:var(--ink);font-family:Fredoka,system-ui,sans-serif}
canvas{display:block;touch-action:none;position:fixed;inset:0}
.card{background:var(--card);border:2.5px solid var(--line);border-radius:14px;box-shadow:3px 3px 0 var(--line)}
#top{position:fixed;left:12px;right:12px;top:calc(var(--safe-area-inset-top,env(safe-area-inset-top,0px)) + 10px);display:flex;justify-content:space-between;gap:8px;pointer-events:none}
#top>div{padding:6px 12px;font-weight:600;font-size:15px}
#ctl{position:fixed;right:12px;bottom:calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)) + 14px);display:flex;flex-direction:column;gap:7px;align-items:stretch;padding:10px;width:170px}
#ctl button{font:inherit;font-weight:500;font-size:14px;background:var(--accent);color:#2a1f2d;border:2.5px solid #2a1f2d;border-radius:10px;padding:6px 10px;cursor:pointer}
#ctl button[aria-pressed=true]{background:#8fdcff}
#ctl .prow{display:flex;gap:5px}#ctl .prow button{flex:1;padding:6px 2px;font-size:13px;background:#9fd6bd}#ctl .prow button[aria-pressed=true]{background:#ff8fab}
#ctl label{font-size:13px;display:flex;flex-direction:column;gap:3px}
input[type=range]{accent-color:var(--accent);width:100%}
#joy{position:fixed;left:18px;bottom:calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)) + 18px);width:112px;height:112px;border-radius:50%;border:3px solid #2a1f2d;background:rgba(255,250,242,.35);touch-action:none}
#knob{position:absolute;left:33px;top:33px;width:40px;height:40px;border-radius:50%;background:var(--accent);border:3px solid #2a1f2d;pointer-events:none}
#clock{white-space:nowrap;font-size:14px;max-width:calc(100vw - 150px);overflow:hidden;text-overflow:ellipsis}
#tbtn{position:fixed;right:12px;top:calc(var(--safe-area-inset-top,env(safe-area-inset-top,0px)) + 54px);display:flex;gap:6px}
#tbtn button{font:inherit;font-weight:600;font-size:14px;color:var(--ink);padding:6px 12px;cursor:pointer}

#playbar button{width:46px;height:46px;border-radius:50%;border:2.5px solid #2a1f2d;background:var(--card);font-size:20px;cursor:pointer;box-shadow:2px 2px 0 #2a1f2d}
#playbar button[aria-pressed=true]{background:#ff8fab}
#qbar{position:fixed;left:10px;right:10px;bottom:calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)) + 10px + var(--kb,0px));padding:8px;z-index:6}
.qrow{display:flex;gap:6px}#q{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:10px;padding:8px 10px}
#qadd,.wide{font:inherit;font-weight:600;background:var(--accent);color:#2a1f2d;border:2.5px solid #2a1f2d;border-radius:10px;padding:8px 14px;cursor:pointer}
.wide{width:100%;margin-top:8px}.ghost{font:inherit;background:transparent;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px;margin-top:8px;width:100%;cursor:pointer}
#qprev{display:none;margin-bottom:8px}#qprev.open{display:block}
.chips{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px}.chip{font:inherit;font-size:13px;display:flex;align-items:center;gap:4px;white-space:nowrap;background:transparent;color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:4px 9px;cursor:pointer}
.chip.on{background:var(--accent);color:#2a1f2d;border-color:#2a1f2d}.pv{margin:6px 2px;font-size:15px}.pv small{display:block;opacity:.75}.pv em{display:block;font-size:13px;color:#d9534f}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;margin-right:4px}
.two{display:flex;gap:8px}.two>*{flex:1}
#sheet{position:fixed;left:10px;right:10px;bottom:calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)) + 10px + var(--kb,0px));max-height:62%;overflow-y:auto;padding:14px 14px 16px;display:none;z-index:5}
#sheet.open{display:block}#sheet h2{margin:0 30px 8px 0;font-size:20px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}#sheet h2 small{font-size:13px;font-weight:400;opacity:.7}
#sheet h3{margin:12px 0 4px;font-size:14px;opacity:.75}#sheet .x{position:absolute;right:10px;top:8px;font-size:22px;background:none;border:0;color:var(--ink);cursor:pointer}
.tl{list-style:none;margin:0;padding:0}.tl li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.tl .tt{flex:1;min-width:0}.tl .tt div{overflow-wrap:anywhere}.tl small{opacity:.7;font-size:13px}.tl li.bad small{color:#d9534f;opacity:1;font-weight:500}.tl li.warn small{color:#c98a00;opacity:1}
.tl li.done .tt div{text-decoration:line-through;opacity:.6}.ck{width:28px;height:28px;flex:none;border-radius:50%;border:2.5px solid var(--accent);background:transparent;color:#2a1f2d;font-weight:700;cursor:pointer}
.tl li.done .ck{background:var(--accent)}.ic{background:none;border:0;font-size:16px;cursor:pointer;color:var(--ink);padding:4px}
.empty,.fine{opacity:.7;font-size:14px}#sheet label{display:flex;flex-direction:column;gap:3px;font-size:13px;margin-top:8px}#sheet label.row{flex-direction:row;align-items:center;gap:8px}
#sheet input,#sheet select{font:inherit;font-size:16px;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:9px;padding:7px 8px}
body.busy #playbar{display:none}
.qic{width:40px;flex:none;font-size:18px;background:transparent;border:2px solid var(--line);border-radius:10px;cursor:pointer}.qic.on{background:#ff8fab;border-color:#2a1f2d;animation:pulse 1s infinite}
@media (max-width:360px){.qic{width:32px;font-size:16px}#qadd{padding:8px 9px}.qrow{gap:4px}#qbar{left:6px;right:6px;padding:6px}}
#pepper{position:fixed;left:10px;right:10px;top:calc(var(--safe-area-inset-top,env(safe-area-inset-top,0px)) + 60px);max-height:75%;overflow-y:auto;z-index:8;padding:14px;display:none;border-color:#2a1f2d}#pepper.open{display:block}
#pepper h2{margin:0 0 4px;font-size:19px}.pex{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.pex input{font:inherit;font-size:15px;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:8px;padding:4px}
.ck.sm{width:22px;height:22px;font-size:12px;vertical-align:middle}.ck.sm.on{background:var(--accent)}.steps li{padding:3px 0}#sheet textarea{font:inherit;font-size:15px;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:9px;padding:6px}
#brief{position:fixed;left:10px;right:10px;bottom:calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)) + 10px + var(--kb,0px));z-index:9;padding:14px;display:none}#brief.open{display:block}
#brief h2{margin:0 0 6px;font-size:18px}#brief .cap{font-size:20px;line-height:1.35;margin:6px 0 10px;min-height:2.7em}.bctl{display:flex;gap:6px}.bctl .mini,#brief .mini{font:inherit;font-size:16px;background:transparent;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer}
#brief .kvbar{height:10px;border:2px solid var(--line);border-radius:8px;overflow:hidden;margin:6px 0}#brief .kvbar i{display:block;height:100%;background:var(--accent);transition:width .3s}#brief .kvs{margin:8px 0 0}
#brief .big{font-size:18px;padding:14px}.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.calg em{font-style:normal;text-align:center;font-size:12px;opacity:.6}
.cd2{aspect-ratio:1;border:1.5px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 0;cursor:pointer}
.cd2.today{border-color:#e94b5a;border-width:2.5px}.cd2.sel{background:var(--accent);color:#2a1f2d}.cd2 b{display:flex;gap:2px;height:7px}.cd2 s{display:block;width:6px;height:6px;border-radius:50%}
@keyframes pulse{50%{transform:scale(1.08)}}.qph{width:44px;height:44px;object-fit:cover;border-radius:8px;float:right;margin-left:8px}
.phs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}.phs img{width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid var(--line)}
.phi{font-size:12px}.phmiss{font-size:12px;opacity:.6;border:1px dashed var(--line);border-radius:8px;padding:6px}
#pview{position:fixed;inset:10px;z-index:9;display:none;flex-direction:column;gap:8px;padding:10px}#pview.open{display:flex}#pview img{flex:1;min-height:0;object-fit:contain;width:100%;border-radius:10px}
#sheet .mini,#pepper .mini{font:inherit;font-size:13px;background:transparent;color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:4px 9px;cursor:pointer;margin:6px 6px 0 0}
#sheet .mini.danger{color:#d9534f}.tl .rt{flex:1;min-width:0;cursor:pointer}.tl .rt div{overflow-wrap:anywhere}.tl li.detail{display:block;padding:6px 0 10px 36px;border-top:0}
.acts{margin-top:4px}.ck.wide-ck{width:auto;min-width:44px;border-radius:14px;padding:0 6px;font-size:12px}.ck.off{display:inline-flex;align-items:center;justify-content:center;border-color:var(--line);color:var(--line)}
.cd{width:38px;flex:none;text-align:center;font-weight:700;font-size:13px;border:2px solid var(--line);border-radius:10px;padding:3px 0}.bad .cd{border-color:#d9534f;color:#d9534f}.warn .cd{border-color:#c98a00;color:#c98a00}
.sum{display:flex;gap:6px;margin:4px 0 8px}.sum div{flex:1;border:2px solid var(--line);border-radius:12px;padding:6px;text-align:center}.sum b{display:block;font-size:17px}.sum small{opacity:.7;font-size:12px}
.amt{font-weight:600}.tag{font-size:11px;border:1.5px solid var(--line);border-radius:999px;padding:0 6px;opacity:.8}.hist{list-style:none;padding:0;margin:4px 0;font-size:13px}.hist li{padding:2px 0}
.heat{display:grid;grid-template-columns:repeat(7,22px);gap:4px;margin:4px 0}.heat b{font-size:11px;text-align:center;opacity:.6}.heat i,.legend i{display:inline-block;width:22px;height:22px;border-radius:6px;background:var(--line);opacity:.35}
.heat i.done,.legend i.done{background:#7fc86b;opacity:1}.heat i.part,.legend i.part{background:#ffd166;opacity:1}.heat i.miss,.legend i.miss{background:#ef8a8a;opacity:1}.heat i.todo{outline:2px solid var(--accent);opacity:.6}.heat i.future{opacity:.1}
.legend{display:block;font-size:11px}.legend i{width:10px;height:10px;border-radius:3px;margin:0 2px 0 6px}.days{display:flex;flex-wrap:wrap;gap:4px 10px}.days label{margin-top:4px!important}
#bubble{position:fixed;left:50%;top:calc(var(--safe-area-inset-top,env(safe-area-inset-top,0px)) + 104px);transform:translateX(-50%);padding:8px 14px;font-weight:500;max-width:80vw;text-align:center;display:none}
:focus-visible{outline:3px solid #8fdcff;outline-offset:2px}
#gsdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:8px;vertical-align:middle;background:transparent}#gsdot.ok{background:#4cd18a}#gsdot.busy{background:#f5c04a}#gsdot.err{background:#e94b5a}
#ask{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(10,8,20,.45);padding:16px}#ask.open{display:flex}#ask .card{max-width:340px;width:100%;padding:18px}#ask p{margin:0 0 14px;font-size:17px;line-height:1.4}#ask #askyes.danger{background:#e94b5a;color:#fff}
body.kbopen #sheet{max-height:calc(100% - var(--kb,0px) - 70px)}body.kbopen #playbar{display:none}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}.tgrid label{min-width:0}.tgrid input{width:100%;min-width:0;box-sizing:border-box}#sheet{overflow-x:hidden}#sheet input,#sheet select{max-width:100%;box-sizing:border-box}
</style>

<body>
<div id="top"><div class="card" id="ttl">Purrminders</div><div class="card" id="clock">--:--</div></div>
<div id="tbtn"><button class="card" id="calBtn" aria-label="Calendar">📅</button><button class="card" id="ideaBtn" aria-label="Ideas jar">💡</button><button class="card" id="agendaBtn">Agenda</button><button class="card" id="menuBtn" aria-label="Menu">☰</button></div>

<div id="qbar" class="card"><div id="qprev"></div><div class="qrow"><input id="q" placeholder="Tell the cats… e.g. gym 3 times a week" enterkeyhint="done" autocomplete="off" aria-label="Quick add a task"><button id="qmic" class="qic" aria-label="Speak a task" aria-pressed="false">🎤</button><button id="qcam" class="qic" aria-label="Add a photo">📷</button><button id="qadd">Add</button></div></div>

<div id="pepper" class="card" role="alertdialog" aria-label="Overdue items"></div>
<div id="brief" class="card" role="dialog" aria-label="Sesame's briefing"></div>
<div id="sheet" class="card" role="dialog" aria-label="Tasks"></div>
<div id="ask" role="alertdialog" aria-modal="true" aria-labelledby="askq"><div class="card"><p id="askq"></p><div class="two"><button class="ghost" id="askno">Cancel</button><button class="wide" id="askyes">OK</button></div></div></div>

<script>
/* battery saver (on unless switched off): fewer redraws, especially when you're not touching the screen, and a slightly softer picture */
const PWR={saver:(()=>{try{const c=window.BLOOPVILLE_CONFIG||{},v=localStorage.getItem('bloopville:'+(c.copyId||'me')+':saver');return v!=='0'}catch(e){return true}})(),touch:performance.now(),last:0,n:0,drawn:0};
PWR.ratio=()=>Math.min(devicePixelRatio||1,PWR.saver?1.5:2);
const R=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});R.setPixelRatio(PWR.ratio());
document.body.prepend(R.domElement);
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,150);
function fit(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',fit);fit();

/* soft plush materials + fur bump */
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const MC={},mat=c=>MC[c]||(MC[c]=new THREE.MeshStandardMaterial({color:c,roughness:.85,metalness:0}));
const nc=document.createElement('canvas');nc.width=nc.height=128;const ncx=nc.getContext('2d'),nid=ncx.createImageData(128,128);
for(let i=0;i<nid.data.length;i+=4){const v=140+Math.random()*115;nid.data[i]=nid.data[i+1]=nid.data[i+2]=v;nid.data[i+3]=255}
ncx.putImageData(nid,0,0);const furTex=new THREE.CanvasTexture(nc);furTex.wrapS=furTex.wrapT=THREE.RepeatWrapping;furTex.repeat.set(4,4);
const FC={},fur=c=>FC[c]||(FC[c]=new THREE.MeshStandardMaterial({color:c,roughness:1,metalness:0,bumpMap:furTex,bumpScale:.02}));
const box=(w,h,d)=>new THREE.BoxGeometry(w,h,d),sph=r=>new THREE.SphereGeometry(r,28,20),cyl=(a,b,h,s)=>new THREE.CylinderGeometry(a,b,h,s||22);
function part(geo,c,p,x,y,z){const m=new THREE.Mesh(geo,typeof c==='number'?mat(c):c);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;p.add(m);return m}

/* office: built by the shared OFFICE builder through a small three.js adapter */
/* Bloopville office: built against R = {g, box, cyl, ball, cone, tor, pic, lamp, wall} so the same code runs in the page and the test harness */
const OFFICE=(()=>{
const cv=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c};
const rr=(x,X,Y,W,H,r)=>{x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath()};
const FONT='Fredoka,"Trebuchet MS",sans-serif';
function cork(x,w,h){x.fillStyle='#c79a68';x.fillRect(0,0,w,h);for(let i=0;i<500;i++){x.fillStyle=Math.random()<.5?'rgba(120,80,40,.25)':'rgba(255,230,190,.25)';x.fillRect(Math.random()*w,Math.random()*h,2,2)}
  x.strokeStyle='#8a6340';x.lineWidth=w*.03;x.strokeRect(0,0,w,h)}
function promoCanvas(){return cv(512,600,(x,w,h)=>{cork(x,w,h);
  const cards=[['SALE','-30%','#ff8fab'],['NEW','Mint tea','#9fd6bd'],['2 DAYS','left!','#ffd166'],['BUY 1','GET 1','#8fdcff'],['POP','Card','#d7a6ff'],['-15%','Snacks','#ffb38a']];
  cards.forEach((c,i)=>{const X=40+(i%2)*230,Y=40+Math.floor(i/3*1.5)*0+Math.floor(i/2)*180;x.save();x.translate(X+95,Y+75);x.rotate((i%2?.05:-.04)*(i+1));
    x.fillStyle=c[2];rr(x,-95,-70,190,140,14);x.fill();x.fillStyle='#4a3326';x.textAlign='center';x.font='700 44px '+FONT;x.fillText(c[0],0,-5);
    x.font='500 28px '+FONT;x.fillText(c[1],0,38);x.fillStyle='#e94b5a';x.beginPath();x.arc(0,-62,9,0,7);x.fill();x.restore()})})}
function stickyCanvas(){return cv(512,330,(x,w,h)=>{cork(x,w,h);x.fillStyle='#4a3326';x.font='600 34px '+FONT;x.fillText('Today',22,42);
  ['#ffe066','#ff8fab','#8fdcff','#b6e88f','#ffb347','#d7a6ff','#ffe066','#8fdcff'].forEach((c,i)=>{const X=24+(i%4)*120,Y=62+Math.floor(i/4)*130;x.save();x.translate(X+50,Y+50);x.rotate((i%3-1)*.07);
    x.fillStyle=c;x.fillRect(-50,-50,100,100);x.strokeStyle='rgba(74,51,38,.55)';x.lineWidth=4;for(let k=0;k<3;k++){x.beginPath();x.moveTo(-34,-22+k*22);x.lineTo(20-k*10,-22+k*22);x.stroke()}x.restore()})})}
function boardCanvas(){return cv(768,450,(x,w,h)=>{x.fillStyle='#fbfbf7';x.fillRect(0,0,w,h);const d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
  x.fillStyle='#3a4a6a';x.font='600 40px '+FONT;x.fillText(d.toLocaleString('en',{month:'long'})+' '+y,30,52);
  const cw=(w-60)/7,ch=(h-110)/6;x.font='500 22px '+FONT;'SMTWTFS'.split('').forEach((c,i)=>{x.fillStyle='#7a8aa6';x.fillText(c,30+i*cw+cw/2-7,88)});
  for(let k=0;k<n;k++){const i=(first+k)%7,j=Math.floor((first+k)/7),X=30+i*cw,Y=100+j*ch;x.strokeStyle='#d9dee8';x.lineWidth=2;x.strokeRect(X,Y,cw,ch);
    x.fillStyle='#5a6a86';x.fillText(k+1,X+8,Y+26);if(k+1===d.getDate()){x.strokeStyle='#e94b5a';x.lineWidth=5;x.beginPath();x.arc(X+cw/2,Y+ch/2,ch*.42,0,7);x.stroke()}

    (p.on&&CAL.cals.length?'<p class="fine">Calendars to show:</p>'+CAL.cals.map(c=>'<label class="row"><input type="checkbox" data-calid="'+esc(c.id)+'"'+(hid.has(c.id)?'':' checked')+'> <span class="dot" style="background:'+esc(c.color)+'"></span> '+esc(c.title)+(c.account&&c.account!==c.title?' <small>('+esc(c.account)+')</small>':'')+'</label>').join(''):'')}
function calWire(){if(!calAvailable())return;
  $('calon').onchange=async e=>{const p=calPrefs();p.on=e.target.checked;calSetPrefs(p);if(!p.on){CAL.events=[];CAL.loaded=0;openMenu();return}$('calst').textContent='Reading your calendar…';await calLoad(true);openMenu()};
  if($('calal'))$('calal').onchange=e=>{const p=calPrefs();p.alerts=e.target.checked;calSetPrefs(p);if(typeof nvSoon==='function')nvSoon(300)};
  if($('calai'))$('calai').onchange=e=>{const p=calPrefs();p.ai=e.target.checked;calSetPrefs(p)};
  $('sheet').querySelectorAll('[data-calid]').forEach(b=>b.onchange=async()=>{const p=calPrefs(),id=b.dataset.calid;p.hidden=p.hidden.filter(x=>x!==id);if(!b.checked)p.hidden.push(id);calSetPrefs(p);await calLoad();if(sheetMode==='menu'&&$('calst'))$('calst').textContent=calLabel()})}
function calInit(){if(!calAvailable()||!calPrefs().on)return;calRestore();calLoad(false);setInterval(()=>{if(!document.hidden)calLoad(false)},30*60e3);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-CAL.loaded>60e3)calLoad(false)})}


/* ===================== keyboard: keep the typing bar and cards above it ===================== */
/* Newer Android draws the keyboard over the app instead of shrinking it, which hid the typing bar. */
const KBD={h:0,base:innerHeight,native:false};
function kbSet(h){h=Math.max(0,Math.round(h||0));const shrink=Math.max(0,KBD.base-innerHeight),off=h>60?Math.max(0,h-shrink):0;KBD.h=off;
  document.documentElement.style.setProperty('--kb',off+'px');document.body.classList.toggle('kbopen',h>60)}
const kbTyping=()=>{const a=document.activeElement;return!!a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable)};
/* remember the full height only when no one is typing (a keyboard may be what shrank the page) */
addEventListener('resize',()=>{if(!kbTyping()&&!document.body.classList.contains('kbopen'))KBD.base=innerHeight;else if(innerHeight>KBD.base)KBD.base=innerHeight;if(KBD.raw)kbSet(KBD.raw)});
(function(){const K=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Keyboard;
  if(K&&K.addListener){KBD.native=true;const on=i=>{KBD.raw=i&&i.keyboardHeight||0;kbSet(KBD.raw)},off=()=>{KBD.raw=0;kbSet(0)};
    K.addListener('keyboardWillShow',on);K.addListener('keyboardDidShow',on);K.addListener('keyboardWillHide',off);K.addListener('keyboardDidHide',off)}
  const vv=window.visualViewport;if(vv)vv.addEventListener('resize',()=>{if(KBD.native)return;KBD.raw=innerHeight-vv.height-vv.offsetTop;kbSet(KBD.raw)})})();

nvInit();calInit();
onTasksChanged();setInterval(()=>{checkAlerts();cats.forEach(C=>C.help=catNeedsHelp(C.id));updateHealth()},20000);checkAlerts();setTimeout(()=>{maybeBrief();pepperCheck()},1200);updateHealth();jarUpdate();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){track();setTimeout(()=>{maybeBrief();pepperCheck()},600)}});
frame();
