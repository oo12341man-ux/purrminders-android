name: Build Purrminders APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Signing key
        env:
          KS: ${{ secrets.PURR_KEYSTORE_B64 }}
          KP: ${{ secrets.PURR_KEYSTORE_PASSWORD }}
        run: |
          # uses repo secrets if you add them later, otherwise the key kept in this private repo
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/purr.jks"; else cp signing/purrminders-signing.jks "$RUNNER_TEMP/purr.jks"; fi
          if [ -z "$KP" ]; then KP="$(cat signing/keystore-password.txt)"; fi
          echo "::add-mask::$KP"
          echo "PURR_KEYSTORE=$RUNNER_TEMP/purr.jks" >> "$GITHUB_ENV"
          echo "PURR_KEYSTORE_PASSWORD=$KP" >> "$GITHUB_ENV"
      - name: Build APK
        run: |
          set -o pipefail
          bash scripts/build.sh 2>&1 | tee build.log
      - name: Publish to Releases (easy download on your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" "Purrminders-1.0.${{ github.run_number }}.apk" build-info.txt --title "Purrminders 1.0.${{ github.run_number }}" --notes-file build-info.txt --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Purrminders-apk
          path: Purrminders-*.apk
          retention-days: 30
      - name: Save the build log (readable without GitHub's log viewer)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          tail -c 900000 build.log > build-log.txt
          gh release create "log-${{ github.run_number }}" build-log.txt --prerelease --title "Build log ${{ github.run_number }}" --notes "Build log for run ${{ github.run_number }} (${{ job.status }})" --repo "${{ github.repository }}" || true
